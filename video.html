<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验视频 | miR-AclE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050d1a;--surface:rgba(255,255,255,.04);--border:rgba(0,225,187,.18);--cyan:#00e1bb;--blue:#4dabf7;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--text:#e8ede8;--text2:#8899b0;--radius:18px}
html{scroll-behavior:auto;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans SC',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
a{color:var(--cyan);text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(5,13,26,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 3rem;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.15rem;font-weight:800;color:var(--cyan);letter-spacing:.06em}
.nav-logo span{color:var(--purple)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:var(--text2);font-size:.88rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}
.page-header{padding:6rem 2rem 2rem;max-width:900px;margin:0 auto}
.page-header h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:#fff;letter-spacing:-.02em;margin-bottom:.5rem}
.page-header .tag{display:inline-block;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);border-radius:999px;padding:.3rem 1rem;font-size:.78rem;color:var(--purple);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;color:var(--text2);font-size:.85rem;margin-bottom:1.5rem;transition:color .2s}
.back-btn:hover{color:var(--cyan)}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.content{max-width:900px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin:2rem 0}
.video-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .3s,transform .3s}
.video-card:hover{border-color:rgba(0,225,187,.35);transform:translateY(-3px)}
.video-thumb{height:160px;background:linear-gradient(135deg,rgba(0,225,187,.1),rgba(167,139,250,.1));display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.video-thumb .play-btn{width:56px;height:56px;border-radius:50%;background:rgba(0,225,187,.2);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.video-thumb:hover .play-btn{background:rgba(0,225,187,.35);transform:scale(1.1)}
.video-thumb .play-btn svg{width:24px;height:24px;stroke:var(--cyan);fill:none;stroke-width:2;margin-left:3px}
.video-info{padding:1.2rem}
.video-info h3{font-size:1rem;font-weight:700;color:#fff;margin-bottom:.3rem}
.video-info p{font-size:.82rem;color:var(--text2)}
.video-info .duration{font-size:.75rem;color:var(--cyan);margin-top:.5rem}
 Coming Soon Card
.video-card.coming-soon .video-thumb{background:rgba(255,255,255,.02);cursor:default}
.video-card.coming-soon .play-btn{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.03)}
.video-card.coming-soon .play-btn svg{stroke:var(--text2)}
.video-card.coming-soon .video-info p{color:var(--text2);font-style:italic}
@media(max-width:768px){nav{padding:0 1.5rem}.nav-links{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(5,13,26,.97);flex-direction:column;gap:0;padding:1rem 0;border-bottom:1px solid var(--border)}.nav-links.open{display:flex}.nav-links a{padding:.8rem 2rem;display:block}.nav-hamburger{display:flex}.page-header{padding:5rem 1.5rem 1.5rem}.content{padding:0 1.5rem 3rem}.video-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav id="navbar">
  <a href="index.html" class="nav-logo">miR-<span>AclE</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">首页</a></li>
    <li><a href="about.html">项目简介</a></li>
    <li><a href="innovation.html">创新亮点</a></li>
    <li><a href="route.html">技术路线</a></li>
    <li><a href="dbtl.html">DBTL循环</a></li>
    <li><a href="data.html">数据成果</a></li>
    <li><a href="timeline.html">项目时间线</a></li>
    <li><a href="video.html">实验视频</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="菜单"><span></span><span></span><span></span></button>
</nav>

<div class="page-header">
  <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a>
  <span class="tag">Video</span>
  <h1>实验视频</h1>
</div>

<div class="content">
  <p style="color:var(--text2);margin-bottom:2rem">关键实验步骤的视频记录，展示从基因构建到体内验证的完整流程。</p>

  <div class="video-grid">
    <div class="video-card coming-soon">

        <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      </div>

    </div>
    <div class="video-card coming-soon">
      <div class="video-thumb">
        <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      </div>
      <div class="video-info">
        <h3>② 细菌转化与筛选</h3>
        <p>热激转化、抗生素筛选与菌落PCR</p>

      </div>
    </div>
    <div class="video-card coming-soon">
      <div class="video-thumb">
        <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      </div>
      <div class="video-info">
        <h3>③ 荧光表达检测</h3>
        <p>荧光显微镜观察与酶标仪定量检测</p>

    </div>
    <div class="video-card coming-soon">
      <div class="video-thumb">
        <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>

      <div class="video-info">

      </div>
    </div>
  </div>
</div>

<script>
const hamburger=document.getElementById('hamburger'),navLinks=document.getElementById('navLinks');
hamburger.addEventListener('click',()=>{navLinks.classList.toggle('open');hamburger.classList.toggle('active')});
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navLinks.classList.remove('open');hamburger.classList.remove('active')}));
</script>
</body>
</html>

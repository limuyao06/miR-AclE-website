<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060b14;--surface:rgba(255,255,255,.04);--border:rgba(0,225,187,.15);--cyan:#00e1bb;--purple:#a78bfa;--green:#34d399;--text:#e2e8f0;--text2:#94a3b8;--glow:0 0 40px rgba(0,225,187,.25);--radius:16px;--radius-sm:10px}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans SC',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
a{color:var(--cyan);text-decoration:none;transition:color .2s}
#dna-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.4}
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(6,11,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 2.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;transition:box-shadow .3s}
nav.scrolled{box-shadow:0 2px 30px rgba(0,225,187,.12)}
.nav-logo{font-size:1.15rem;font-weight:800;color:var(--cyan);letter-spacing:.05em}
.nav-logo span{color:var(--purple)}
.nav-links{display:flex;gap:1.5rem;list-style:none}
.nav-links a{color:var(--text2);font-size:.88rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;color:var(--text2);font-size:.85rem;margin-bottom:2rem;transition:color .2s}
.back-btn:hover{color:var(--cyan)}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.page-content{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:6rem 2rem 4rem}
.section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--cyan);font-weight:700;margin-bottom:.5rem}
.section-title{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;margin-bottom:.8rem;color:#fff;line-height:1.3}
.section-desc{color:var(--text2);margin-bottom:2.5rem;font-size:.95rem;line-height:1.8}
.video-placeholder{position:relative;width:100%;max-width:700px;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:linear-gradient(145deg,#0a1628,#1a0a2e);border:1px solid var(--border);margin:0 auto;transition:border-color .35s,box-shadow .35s}
.video-placeholder:hover{border-color:rgba(0,225,187,.4);box-shadow:var(--glow)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:all .3s}
.video-placeholder:hover .play-btn{background:rgba(0,225,187,.2);transform:translate(-50%,-50%) scale(1.1)}
.play-btn svg{width:24px;height:24px;fill:#fff;margin-left:2px}
.vid-label{position:absolute;bottom:1rem;left:1.2rem;color:rgba(255,255,255,.7);font-size:.82rem}
.vid-tag{position:absolute;top:.8rem;right:.8rem;background:rgba(0,225,187,.2);border:1px solid rgba(0,225,187,.3);border-radius:999px;padding:.2rem .7rem;font-size:.7rem;color:#fff;font-weight:600;letter-spacing:.05em}
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1)}
.fade-up.visible{opacity:1;transform:translateY(0)}
@media(max-width:768px){nav{padding:0 1.2rem}.nav-links{display:none!important;position:absolute;top:60px;left:0;right:0;background:rgba(6,11,20,.97);backdrop-filter:blur(18px);flex-direction:column;gap:0;padding:1rem;border-bottom:1px solid var(--border)}.nav-links.open{display:flex!important}.nav-links a{padding:.8rem 1rem;border-bottom:1px solid var(--border)}.nav-hamburger{display:flex}.nav-hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}.nav-hamburger.active span:nth-child(2){opacity:0}.nav-hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}.page-content{padding:5rem 1.2rem 3rem}}
</style>
</head>
<body>
<canvas id="dna-canvas"></canvas>
<nav id="navbar">
  <a href="/" class="nav-logo">miR-<span>AclE</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="about.html">项目简介</a></li>
    <li><a href="innovation.html">创新点</a></li>
    <li><a href="route.html">技术路线</a></li>
    <li><a href="dbtl.html">DBTL 循环</a></li>
    <li><a href="data.html">数据成果</a></li>
    <li><a href="timeline.html">实施计划</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="page-content">
<a href="/" class="back-btn fade-up"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a>
<div class="fade-up">
  <p class="section-label">Videos</p>
  <h1 class="section-title">实验过程视频</h1>
  <p class="section-desc">序列设计、分子信标合成、荧光检测等关键实验步骤的视频记录（录制中）。</p>
</div>
<div class="video-placeholder fade-up">
  <div style="position:absolute;inset:0;overflow:hidden;opacity:.3">
    <div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:0%;animation:helix-scroll 4s linear infinite;animation-delay:0s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:8%;animation:helix-scroll 4s linear infinite;animation-delay:0.2s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:16%;animation:helix-scroll 4s linear infinite;animation-delay:0.4s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:24%;animation:helix-scroll 4s linear infinite;animation-delay:0.6000000000000001s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:32%;animation:helix-scroll 4s linear infinite;animation-delay:0.8s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:40%;animation:helix-scroll 4s linear infinite;animation-delay:1s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:48%;animation:helix-scroll 4s linear infinite;animation-delay:1.2000000000000002s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:56%;animation:helix-scroll 4s linear infinite;animation-delay:1.4000000000000001s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:64%;animation:helix-scroll 4s linear infinite;animation-delay:1.6s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:72%;animation:helix-scroll 4s linear infinite;animation-delay:1.8s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:80%;animation:helix-scroll 4s linear infinite;animation-delay:2s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:88%;animation:helix-scroll 4s linear infinite;animation-delay:2.2s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:96%;animation:helix-scroll 4s linear infinite;animation-delay:2.4000000000000004s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:104%;animation:helix-scroll 4s linear infinite;animation-delay:2.6s"></div><div style="position:absolute;width:100%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(0,225,187,.4),rgba(167,139,250,.4),transparent);top:112%;animation:helix-scroll 4s linear infinite;animation-delay:2.8000000000000003s"></div>
  </div>
  <div class="vid-tag">实验视频</div>
  <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
  <div class="vid-label">▶ 实验过程记录（即将发布）</div>
</div>
<style>@keyframes helix-scroll{0%{transform:translateY(-100%) rotate(0deg)}100%{transform:translateY(100vh) rotate(360deg)}}</style>
</div>
<footer style="background:rgba(6,11,20,.95);border-top:1px solid var(--border);padding:2rem;text-align:center;position:relative;z-index:1">
  <p style="font-size:.85rem;color:var(--text2)">ATCG 碱基互补配队 — 天津大学 合成生物学专业 · AI+合成生物创新大赛</p>
  <p style="margin-top:.8rem;font-size:.75rem;color:rgba(255,255,255,.25)">&#169; 2026 miR-AclE Project</p>
</footer>
<script>
const canvas=document.getElementById('dna-canvas'),ctx=canvas.getContext('2d');
let W,H,particles=[];
const COLORS=['#00e1bb','#a78bfa','#4dabf7','#34d399'];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
class P{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.r=Math.random()*2+.5;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];this.alpha=Math.random()*.5+.15}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=this.color;ctx.globalAlpha=this.alpha;ctx.fill();ctx.globalAlpha=1}}
for(let i=0;i<80;i++)particles.push(new P());
function drawLines(){for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<150){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=particles[i].color;ctx.globalAlpha=.08*(1-dist/150);ctx.lineWidth=.5;ctx.stroke();ctx.globalAlpha=1}}}}
function animate(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw()});drawLines();requestAnimationFrame(animate)}
animate();
window.addEventListener('scroll',()=>document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>40));
const hamburger=document.getElementById('hamburger'),navLinks=document.getElementById('navLinks');
hamburger.addEventListener('click',()=>{navLinks.classList.toggle('open');hamburger.classList.toggle('active')});
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navLinks.classList.remove('open');hamburger.classList.remove('active')}));
const transition=document.createElement('div');
transition.style.cssText='position:fixed;inset:0;z-index:9999;background:#060b14;pointer-events:none;opacity:0;transition:opacity .18s ease';
document.body.appendChild(transition);
document.querySelectorAll('a[href^="/"],a[href$=".html"]').forEach(link=>{
  link.addEventListener('click',e=>{const href=link.getAttribute('href');if(href.startsWith('http')||href==='#')return;e.preventDefault();transition.style.opacity='1';setTimeout(()=>window.location.href=href,200)});
});
const fadeEls=document.querySelectorAll('.fade-up');
const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}})},{threshold:.12});
fadeEls.forEach(el=>observer.observe(el));
</script>
</body>
</html>
